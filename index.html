<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NerdMiner_v2 350 KH/s Webflasher</title>
    <meta
      name="description"
      content="Easily allow users to install NerdMiner_v2 with the improved 350 KH/s speed on the Cheap-Yellow-Displays and serveral other cheap ESP32 boards."
    />
    <meta name="viewport" content="width=device-width" />
    <meta name="color-scheme" content="dark light" />
    
    
    <style>
      body {
        font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI",
          Roboto, Ubuntu, sans-serif;
        padding: 0;
        margin: 0;
        line-height: 1.4;
      }
      .content {
        max-width: 600px;
        margin: 0 auto;
        padding: 12px;
      }
      h2 {
        margin-top: 2em;
      }
      h3 {
        margin-top: 1.5em;
      }
      a {
        color: #03a9f4;
      }
      .invisible {
        visibility: hidden;
      }
      .hidden {
        display: none;
      }
      esp-web-install-button[install-unsupported] {
        visibility: inherit;
      }
      .content pre {
        max-width: 100%;
        overflow-y: scroll;
      }
      .footer {
        margin-top: 24px;
        border-top: 1px solid #ccc;
        padding-top: 24px;
        text-align: center;
      }
      .footer .initiative {
        font-style: italic;
        margin-top: 16px;
      }
      table {
        border-spacing: 0;
      }
      td {
        padding: 8px;
        border-bottom: 1px solid #ccc;
      }
      .radios li {
        list-style: none;
        line-height: 2em;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #333;
          color: #fff;
        }
        a {
          color: #58a6ff;
        }
      }
    </style>
    <script type="module" src="https://unpkg.com/esp-web-tools@8.0.1/dist/web/install-button.js?module"></script>
  </head>
  <body>
    <div class="content">
      <h1>NerdMiner CYD Modded Web Flasher</h1>
      <p>Choose your hardware to flash via browser:</p>
      <ul class="radios">
        <li>
          <label><input type="radio" name="type" value="cyd" /> CYD 2.8" Micro-USB only (ESP32-2432S028R)</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="cyd2usb" /> CYD 2.8" USB-C and USB-micro (ESP32-2432S028R-2USB)</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="cyd24" /> CYD 2.4" Single USB-C (ESP32-2432S024R)</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="ttgo_t_display" /> LILYGO/TTGO T-Display</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="c3supermini" /> ESP32-C3 Super Mini</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="C2MiniWemos" /> Wemos C2 / S2 Mini</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="m5stickc" /> M5Stick-C</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="ESP32DevKitV1" /> ESP32 DevKit V1</label>
        </li>
      </ul>
      <p class="button-row" align="center">
        <esp-web-install-button class="invisible"></esp-web-install-button>
      </p>

      <div class="footer">
        ✨ <a href="https://github.com/guitarbeat/nerdminer-cyd-modded"
          >Project GitHub Repository</a
        > &mdash;
        Installer powered by <a href="https://esphome.github.io/esp-web-tools/">ESP Web Tools</a> 🛠️
    </div>
     <script>
      document.querySelectorAll('input[name="type"]').forEach(radio =>
        radio.addEventListener("change", () => {
          const button = document.querySelector('esp-web-install-button');
          button.manifest = `web/manifest_${radio.value}.json`;
          button.classList.remove('invisible');
        }
      ));
    </script>
  </body>
</html>

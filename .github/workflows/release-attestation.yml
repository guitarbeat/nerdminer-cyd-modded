name: Build & Attest Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    name: Build & Generate Attestations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Compile Target Environments
        run: |
          pio run -e ESP32-2432S028R-BL27 \
                  -e ESP32-2432S028R \
                  -e ESP32-2432S024 \
                  -e ESP32_2432S028_2USB

      - name: Collect Release Artifacts
        run: |
          mkdir -p dist
          # Copy factory and update binaries
          cp firmware/v2.0.0/*.bin dist/ || cp firmware/v*/*.bin dist/
          cd dist
          sha256sum *.bin > SHA256SUMS
          cat SHA256SUMS

      - name: Attest Build Provenance (Sigstore / OIDC)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*.bin'

      - name: Upload Attested Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.bin
            dist/SHA256SUMS
